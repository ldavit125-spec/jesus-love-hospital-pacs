  padding: 0;
}

  background-color: var(--bg-dark);
  color: var(--text-main);
  overflow: hidden;
}

.viewer-app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  background-color: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}

.header-title-area {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.badge-tag {
  background-color: #1e3a8a;
  color: #93c5fd;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.2rem 0.6rem;
  border-radius: 9999px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.header-title-area h1 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.patient-pill {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: var(--bg-card);
  padding: 0.35rem 0.85rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 0.85rem;
}

.patient-pill span {
  color: var(--text-muted);
}

.patient-pill strong {
  color: var(--text-main);
}

.viewer-workspace {
  display: flex;
  flex: 1;
  position: relative;
  overflow: hidden;
}

.viewer-viewport-wrapper {
  flex: 1;
  position: relative;
  background-color: #000000;
  display: flex;
  flex-direction: column;
}

.cornerstone-canvas-container {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  cursor: crosshair;
}

.toolbar-overlay {
  position: absolute;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 0.5rem;
  background: rgba(17, 24, 39, 0.85);
  backdrop-filter: blur(8px);
  padding: 0.4rem;
  border-radius: 8px;
  border: 1px solid rgba(75, 85, 99, 0.6);
  z-index: 10;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
}

.tool-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  padding: 0.5rem 0.85rem;
  border-radius: 6px;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.15s ease;
}

.tool-btn:hover {
  background: var(--bg-card);
  color: var(--text-main);
}

.tool-btn.active {
  background: var(--primary);
  color: #ffffff;
  border-color: #60a5fa;
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
}

.tool-btn.reset-btn:hover {
  background: rgba(239, 68, 68, 0.2);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.4);
}

.info-overlay {
  position: absolute;
  padding: 1rem;
  font-size: 0.825rem;
  font-family: monospace;
  color: #93c5fd;
  text-shadow: 0 1px 2px #000000;
  pointer-events: none;
  z-index: 5;
  line-height: 1.4;
}

.info-overlay.top-left {
  top: 0;
  left: 0;
}

.info-overlay.top-right {
  top: 0;
  right: 0;
  text-align: right;
}

.info-overlay.bottom-left {
  bottom: 0;
  left: 0;
}

.info-overlay.bottom-right {
  bottom: 0;
  right: 0;
  text-align: right;
}

.status-indicator-bar {
  position: absolute;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(17, 24, 39, 0.9);
  border: 1px solid var(--border);
  padding: 0.5rem 1rem;
  border-radius: 20px;
  font-size: 0.85rem;
  color: var(--text-muted);
  z-index: 10;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.status-dot.loading {
  background: #f59e0b;
  animation: pulse 1s infinite;
}

.status-dot.error {
  background: var(--danger);
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

.error-banner {
  position: absolute;
  top: 4.5rem;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(153, 27, 27, 0.9);
  border: 1px solid #ef4444;
  color: #fee2e2;
  padding: 0.75rem 1.25rem;
  border-radius: 6px;
  z-index: 20;
  max-width: 80%;
  text-align: center;
}
</style></head>
